kind = "OVERWRITE"
helper = "src/chat_tree.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "base", ty = "Option<&horizon_client::command::Dispatcher>", value = "base" },
]

[[native.mixin]]
id = "command"
kind = "HEAD"
helper = "src/command.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "command", ty = "&str", value = "command" },
    { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
target = "horizon_client::game::native_hooks::base::Game<'_>::native_command"

[[native.mixin]]
id = "world_drawn"

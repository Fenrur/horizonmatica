id = "horizonmatica"
name = "Horizonmatica"
version = "0.3.7"
description = "Schematic overlays, verifier, material lists and automatic placement."
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "horizonmatica"
source = "src/runtime.rs"

[[native.module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "horizonmatica_bridge"
source = "src/bridge.rs"
visibility = "pub"

[[native.module]]
id = "menus_game"
file = "crates/horizon-client/src/game.rs"
name = "horizonmatica_menus"
source = "src/menus_game.rs"

[[native.mixin]]
id = "tick"
kind = "HEAD"
helper = "src/tick.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
target = "horizon_client::game::native_hooks::client_tick_pre::Game<'_>::native_client_tick_pre"

[[native.mixin]]
id = "frame"
kind = "HEAD"
helper = "src/frame.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
target = "horizon_client::game::native_hooks::render_frame_pre::Game<'_>::native_render_frame_pre"

[[native.mixin]]
id = "hud"
kind = "HEAD"
helper = "src/hud.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
    { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *draw" },
    { name = "corners", ty = "&mut mod_api::Corners", value = "&mut *corners" },
]
target = "horizon_client::game::native_hooks::render_gui_post::Game<'_>::native_render_gui_post"

[[native.mixin]]
id = "key"
kind = "HEAD"
helper = "src/key.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "key", ty = "&str", value = "key" },
    { name = "action", ty = "mod_api::KeyAction", value = "action" },
]
target = "horizon_client::game::native_hooks::input_key::Game<'_>::native_input_key"

[[native.mixin]]
id = "wheel"
kind = "HEAD"
helper = "src/wheel.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "scroll", ty = "[f64; 2]", value = "scroll" },
    { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]
target = "horizon_client::game::native_hooks::base::Game<'_>::native_mouse_scrolling"

[[native.mixin]]
id = "mouse"
target = "horizon_client::game::play_input::Game<'_>::play_mouse"
kind = "HEAD"
cancellable = true
helper = "src/mouse.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "button", ty = "winit::event::MouseButton", value = "button" },
    { name = "pressed", ty = "bool", value = "pressed" },
]

[[native.mixin]]
id = "chat_tree"
